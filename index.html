<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esponjamanía: Education Edition (2 Columnas)</title>
    
    <style>
        /* === FONDO ANIMADO DE BURBUJAS === */
        body {
            background: radial-gradient(circle, #ffe066 10%, #ffcc00 90%);
            font-family: "Comic Sans MS", "Comic Sans", cursive;
            margin: 0;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .burbujas-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
        }
        .burbuja {
            position: absolute; bottom: -100px; background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 50%; animation: subir 10s linear infinite;
        }
        .burbuja::after {
            content: ''; position: absolute; top: 15%; left: 15%; width: 25%; height: 25%; background: rgba(255, 255, 255, 0.4); border-radius: 50%;
        }
        @keyframes subir {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-120vh) translateX(50px); opacity: 0; }
        }
        .burbuja:nth-child(1) { width: 40px; height: 40px; left: 10%; animation-duration: 8s; }
        .burbuja:nth-child(2) { width: 80px; height: 80px; left: 20%; animation-duration: 12s; }
        .burbuja:nth-child(3) { width: 30px; height: 30px; left: 35%; animation-duration: 7s; }
        .burbuja:nth-child(4) { width: 60px; height: 60px; left: 50%; animation-duration: 10s; }

        /* === CONTENIDO PRINCIPAL === */
        .tarjeta-educativa {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 50px;
            box-shadow: 0 20px 0px rgba(0, 0, 0, 0.1), 0 10px 50px rgba(0,0,0,0.2);
            max-width: 900px; 
            text-align: center;
            border: 8px solid #4db8ff;
            position: relative;
            z-index: 1;
        }

        .fila-contenido {
            display: flex;
            align-items: center; 
            justify-content: space-between; 
            gap: 40px; 
            margin-bottom: 25px; 
        }

        .columna-texto {
            flex: 2; 
            text-align: left; 
        }

        .columna-imagen {
            flex: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 300px; 
        }

        .columna-imagen img {
            max-width: 100%;
            height: auto;
            object-fit: contain; 
        }

        h1 {
            font-size: 3rem;
            color: #e67e22;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 3px 3px 0px #fff, 6px 6px 0px #d35400;
        }

        p {
            font-size: 1.2rem;
            background: #f0f9ff;
            padding: 20px;
            border-radius: 20px;
            border: 2px dashed #4db8ff;
            margin: 20px 0;
        }

        /* --- ESTILOS DE BOTONES --- */
        .contenedor-botones {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .boton {
            background: #2ecc71; 
            border: none; 
            padding: 15px 30px; 
            font-family: 'Comic Sans MS'; 
            font-weight: bold; 
            color: white; 
            border-radius: 15px; 
            font-size: 1.1rem; 
            cursor: pointer; 
            box-shadow: 0 5px 0 #27ae60; 
            transition: transform 0.2s;
            text-decoration: none; /* Para que el link no se subraye */
            display: inline-block;
        }

        .boton:active { 
            transform: translateY(4px); 
            box-shadow: 0 1px 0 #27ae60; 
        }

        /* Botón específico para el Video */
        .boton-video {
            background: #3498db;
            box-shadow: 0 5px 0 #2980b9;
        }

        .boton-video:active {
            box-shadow: 0 1px 0 #2980b9;
        }
    </style>
</head>
<body>

    <div class="burbujas-container">
        <div class="burbuja"></div><div class="burbuja"></div><div class="burbuja"></div><div class="burbuja"></div>
    </div>

    <div class="tarjeta-educativa">
        
        <div class="fila-contenido"> 
            <div class="columna-texto"> 
                <h1>🧽 ESPONJAMANIA</h1>
                <h3 style="color: #2980b9;">Education Edition</h3>
                
                <p>
                    ¡Esponjamanía ha empezado su aventura educativa! 
                    Resuelve los ejercicios de <strong>suma, resta, multiplicación y división</strong> 
                    y sobrevive a los oráculos matemáticos.
                </p>
            </div>
            
            <div class="columna-imagen"> 
                <img src="Esponjamania Sticker.png" alt="Imagen decorativa de Esponjamanía">
            </div>
        </div> 

        <div class="contenedor-botones">
            <button class="boton">¡ACEPTAR DESAFÍO! ⚔️</button>
            
            <a href="video.html" class="boton boton-video">VER VIDEO INFO 🎬</a>
        </div>

    </div>

</body>
</html>
